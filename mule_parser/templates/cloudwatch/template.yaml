Resources:
  {{resource_prefix}}ErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: {{resource_prefix}}-lambda-errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Threshold: 1
      EvaluationPeriods: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
