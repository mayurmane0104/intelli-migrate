[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:caddy]
command=caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0


[program:nextjs]
command=/entrypoint-start-nextjs.sh
autostart=true
autorestart=true
priority=20
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:fastify]
command=/entrypoint-start-fastify.sh
autostart=true
autorestart=true
priority=25
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:parser]
directory=/app
command=uvicorn mule_parser.api.app:app --host 127.0.0.1 --port 8000
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:celery]
directory=/app
command=celery -A mule_parser.api.celery_app:celery_app worker --loglevel=info --concurrency=1
autostart=true
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:chromadb]
directory=/app
command=/bin/bash -lc 'if [ -z "${CHROMA_HOST:-}" ]; then echo "[chromadb] disabled"; sleep infinity; fi; exec chroma run --path /var/lib/chromadb --host 127.0.0.1 --port "${CHROMA_PORT:-8100}"'
autostart=true
autorestart=true
priority=50
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:kb-ingest]
directory=/app
command=/bin/bash -lc 'if [ "${CHROMA_AUTO_INGEST:-true}" != "true" ] || [ -z "${CHROMA_HOST:-}" ]; then exit 0; fi; host="${CHROMA_HOST:-127.0.0.1}"; port="${CHROMA_PORT:-8100}"; for _ in $(seq 1 120); do if curl -fsS "http://${host}:${port}/api/v2/heartbeat" >/dev/null 2>&1 || curl -fsS "http://${host}:${port}/api/v1/heartbeat" >/dev/null 2>&1; then break; fi; sleep 1; done; python mule_parser/scripts/ingest_kb.py || true'
autostart=true
autorestart=false
startsecs=0
priority=95
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
